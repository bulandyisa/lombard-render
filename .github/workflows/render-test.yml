name: render-test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        engine: [EEVEE, CYCLES]
    env:
      LOMBARD_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libgles2 libgl1-mesa-dri libglx-mesa0 libegl-mesa0 \
            mesa-utils libxkbcommon0 libxkbcommon-x11-0 libsm6 libice6 libxi6 libxrender1 libxxf86vm1 libxfixes3 libx11-6 libxext6 \
            libwayland-client0 libwayland-egl1 libdecor-0-0 fonts-dejavu-core xvfb
          nproc; free -g
      - name: Blender 5.2.2
        run: |
          curl -sL -o b.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
          tar xf b.tar.xz && mv blender-5.2.2-linux-x64 blender && ./blender/blender --version | head -1
      - name: Build scene
        run: ./blender/blender -b --python scene/lombard3d.py 2>&1 | grep -E "SAVED|Error|Traceback|letters|jars"
      - name: Render 4 test frames
        env:
          LOMBARD_ENGINE: ${{ matrix.engine }}
        run: |
          ARGS="-b scene/lombard3d.blend --python scene/render3d.py -- out 1920 40 20 78 130 210"
          START=$(date +%s)
          if [ "${{ matrix.engine }}" = "EEVEE" ]; then
            ./blender/blender --gpu-backend opengl $ARGS > log.txt 2>&1 || true
            if ! grep -q "RENDER DONE" log.txt; then
              echo "EGL failed, retrying with a virtual display (Xvfb)"; tail -20 log.txt; rm -rf out
              xvfb-run -a -s "-screen 0 1920x1080x24" ./blender/blender --gpu-backend opengl $ARGS > log.txt 2>&1 || true
            fi
          else
            ./blender/blender $ARGS > log.txt 2>&1 || true
          fi
          echo "TOTAL $(( $(date +%s) - START )) s"
          grep -E "ENGINE|FRAME|DONE|GPU|OpenGL|renderer|Error" log.txt | head -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-${{ matrix.engine }}
          path: |
            out/
            log.txt
